<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="pedidos">

  <div class="border border-blue-200 shadow-md rounded-lg">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 border-b border-blue-200 p-6 flex justify-between items-center">
      <div>
        <h3 class="text-xl font-semibold text-blue-900">Mis Pedidos</h3>
        <p class="text-slate-600">Historial de compras y estado de entregas</p>
      </div>
      <div class="text-right">
        <p class="text-sm text-gray-600">Total gastado</p>
        <p class="text-2xl font-bold text-blue-600">
          S/ <span th:text="${totalGastado}">0.00</span>
        </p>
      </div>
    </div>

    <!-- Info -->
    <div class="p-4 bg-cyan-50 border-b border-cyan-200">
      <p class="text-sm text-gray-700">
        <span class="font-semibold text-blue-900"
              th:text="${totalPedidos}">0</span>
        pedidos registrados
      </p>
    </div>

    <!-- Tabla -->
    <div class="p-6 overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-blue-50 border border-blue-200">
            <th class="p-3 text-left text-blue-900">ID Pedido</th>
            <th class="p-3 text-left text-blue-900">Fecha</th>
            <th class="p-3 text-right text-blue-900">Total</th>
            <th class="p-3 text-center text-blue-900">Estado</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="venta : ${ventas}"
              class="border border-blue-200 hover:bg-blue-50">

            <td class="p-3 font-mono text-blue-600">
              #ORD-<span th:text="${venta.idVenta}">1</span>
            </td>

            <td class="p-3 text-gray-700"
                th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}">
              01/01/2026
            </td>

            <td class="p-3 text-right font-semibold text-gray-700">
              S/ <span th:text="${venta.total}">0.00</span>
            </td>

            <!-- Estado -->
            <td class="p-3 text-center">
              <span th:switch="${venta.estado}">

                <span th:case="'PAGADO'"
                      class="px-3 py-1 rounded-full bg-green-100 text-green-800 border border-green-300">
                  Entregado
                </span>

                <span th:case="'PENDIENTE'"
                      class="px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300">
                  Pendiente
                </span>

                <span th:case="*"
                      class="px-3 py-1 rounded-full bg-blue-100 text-blue-800 border border-blue-300">
                  En proceso
                </span>

              </span>
            </td>

          </tr>

          <!-- Sin pedidos -->
          <tr th:if="${ventas.isEmpty()}">
            <td colspan="4" class="p-4 text-center text-slate-500">
              No tienes pedidos registrados aún.
            </td>
          </tr>

        </tbody>
      </table>
    </div>

  </div>

</div>
</html>
