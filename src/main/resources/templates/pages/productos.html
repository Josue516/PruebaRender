<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout}">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .producto-card {
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        
        .producto-card:hover {
            will-change: transform, box-shadow;
        }
        
        #contenedor-productos {
            transition: opacity 0.3s ease;
        }
        
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div th:fragment="content">
        <div class="bg-gray-50 min-h-screen">
            <header class="bg-white border-b border-gray-100 pt-2 pb-2">
                <div class="container mx-auto px-4">
                    
                    <h1 class="text-3xl md:text-4xl lg:text-5xl font-black text-slate-900 animate__animated animate__fadeInDown">
                        Nuestra <span class="text-blue-600">Tienda Smart</span>
                    </h1>
                    <p class="text-slate-500 mt-4 text-base md:text-lg animate__animated animate__fadeIn animate__delay-1s">
                        Equipa tu hogar con lo último en tecnología y automatización.
                    </p>
                </div>
            </header>

            <div class="container mx-auto px-4 py-4 md:py-6">
                <div class="flex flex-col md:flex-row gap-6 lg:gap-10">
                    
                    <aside class="w-full md:w-72 lg:w-80">
                        <button 
                            class="md:hidden w-full bg-blue-600 text-white px-5 py-3 rounded-2xl mb-4 font-bold flex items-center justify-between shadow-lg hover:bg-blue-700 transition-colors"
                            onclick="toggleMenu()"
                            aria-expanded="false"
                            aria-controls="menu-categorias"
                            id="btn-toggle-menu">
                            <span>Filtrar por Categoría</span>
                            <svg class="w-5 h-5 transition-transform duration-300" id="icon-toggle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        
                        <div id="menu-categorias" 
                             class="hidden md:block bg-white p-6 rounded-3xl shadow-sm border border-gray-100 md:sticky md:top-28 animate__animated animate__fadeInLeft">
                            <h2 class="text-xs font-black uppercase tracking-widest text-gray-400 mb-6">Categorías</h2>
                            
                            <nav class="flex flex-col gap-2" id="filtro-nav" role="navigation" aria-label="Categorías de productos">
                                <a th:href="@{/productos}" 
                                   onclick="filtrarAjax(event, this)"
                                   th:data-id="todos"
                                   th:aria-current="${categoriaSeleccionada == 'todos'} ? 'page' : 'false'"
                                   th:class="${categoriaSeleccionada == 'todos'} ? 'bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all' : 'text-slate-600 hover:bg-gray-50 px-5 py-3 rounded-2xl transition-all hover:translate-x-1'">
                                   <span class="flex items-center gap-2">
                                       <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                                       </svg>
                                       Todos los equipos
                                   </span>
                                </a>
                                
                                <a th:each="cat : ${categorias}"
                                   th:href="@{/productos(idCat=${cat.idCategoria})}"
                                   th:data-id="${cat.idCategoria}"
                                   onclick="filtrarAjax(event, this)"
                                   th:text="${cat.nombre}"
                                   th:aria-current="${categoriaSeleccionada == cat.idCategoria} ? 'page' : 'false'"
                                   th:class="${categoriaSeleccionada == cat.idCategoria} ? 'bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all' : 'text-slate-600 hover:bg-gray-50 px-5 py-3 rounded-2xl transition-all hover:translate-x-1'">
                                </a>
                            </nav>
                        </div>
                    </aside>

                    <main class="flex-1 min-h-[400px]" id="contenedor-productos" role="main" aria-live="polite" aria-busy="false">
                        
                        <div th:fragment="productosGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 animate__animated animate__fadeIn">
                            
                            <article th:each="p : ${productos}" 
                                 class="producto-card group bg-white rounded-[2rem] md:rounded-[2.5rem] border border-gray-100 p-4 md:p-6 hover:shadow-2xl hover:shadow-blue-100 transition-all duration-500 hover:-translate-y-2 relative">
                                
                                <div class="absolute top-4 md:top-6 left-4 md:left-6 z-10">
                                    <span class="bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-full shadow-sm border border-gray-100" 
                                          th:text="${p.marca}">Marca</span>
                                </div>

                                <div class="aspect-square rounded-2xl md:rounded-3xl bg-slate-50 mb-4 md:mb-6 overflow-hidden flex items-center justify-center p-4 md:p-6">
                                    <img th:src="${p.imagenes != null && !p.imagenes.empty ? p.imagenes[0].urlImagen : '/img/placeholder.png'}" 
                                         th:alt="${p.nombre}"
                                         loading="lazy"
                                         class="w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-700">
                                </div>

                                <div class="space-y-2">
                                    <p class="text-blue-600 text-[10px] font-black uppercase tracking-widest" 
                                       th:text="${p.categoria.nombre}">CATEGORÍA</p>
                                    <h3 class="text-slate-900 font-bold text-lg md:text-xl leading-tight h-12 md:h-14 line-clamp-2" 
                                        th:text="${p.nombre}">Nombre del Producto</h3>
                                    
                                    <div class="flex items-center justify-between pt-3 md:pt-4">
                                        <span class="text-xl md:text-2xl font-black text-slate-900" 
                                              th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}">S/ 0.00</span>
                                        <button class="bg-slate-900 hover:bg-blue-600 text-white w-11 h-11 md:w-12 md:h-12 rounded-xl md:rounded-2xl flex items-center justify-center transition-all duration-300 shadow-md hover:rotate-12 hover:scale-110"
                                                th:aria-label="'Ver detalles de ' + ${p.nombre}"
                                                onclick="verDetalles(this)">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M5 12h14"/>
                                                <path d="m12 5 7 7-7 7"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </article>

                            <div th:if="${#lists.isEmpty(productos)}" class="col-span-full py-16 md:py-24 text-center">
                                <svg class="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                                </svg>
                                <h3 class="text-xl md:text-2xl font-bold text-slate-400 mb-2">No hay productos en esta categoría</h3>
                                <p class="text-slate-400 mb-6">Intenta con otro filtro.</p>
                                <a th:href="@{/productos}" 
                                   onclick="filtrarAjax(event, this)"
                                   class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
                                    Ver todos los productos
                                </a>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <template id="skeleton-template">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                <div class="bg-white rounded-[2rem] md:rounded-[2.5rem] border border-gray-100 p-4 md:p-6" th:each="i : ${#numbers.sequence(1, 6)}">
                    <div class="aspect-square rounded-2xl md:rounded-3xl bg-slate-200 mb-4 md:mb-6 skeleton"></div>
                    <div class="h-3 bg-slate-200 rounded w-1/2 mb-2 skeleton"></div>
                    <div class="h-5 bg-slate-200 rounded mb-2 skeleton"></div>
                    <div class="h-5 bg-slate-200 rounded w-3/4 mb-4 skeleton"></div>
                    <div class="h-8 bg-slate-200 rounded w-1/3 skeleton"></div>
                </div>
            </div>
        </template>

        <template id="error-template">
            <div class="col-span-full py-16 md:py-24 text-center">
                <svg class="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <h3 class="text-xl md:text-2xl font-bold text-red-500 mb-2">Error al cargar productos</h3>
                <p class="text-slate-400 mb-6">Por favor, intenta de nuevo.</p>
                <button onclick="location.reload()" 
                        class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg">
                    Recargar página
                </button>
            </div>
        </template>

        <script>
            function toggleMenu() {
                const menu = document.getElementById('menu-categorias');
                const icon = document.getElementById('icon-toggle');
                const btn = document.getElementById('btn-toggle-menu');
                
                menu.classList.toggle('hidden');
                icon.classList.toggle('rotate-180');
                
                const isExpanded = !menu.classList.contains('hidden');
                btn.setAttribute('aria-expanded', isExpanded);
                
                if (isExpanded) {
                    menu.classList.add('animate__animated', 'animate__fadeIn', 'animate__faster');
                }
            }

            function filtrarAjax(event, element) {
                event.preventDefault();
                
                const url = element.getAttribute('href');
                const contenedor = document.getElementById('contenedor-productos');
                
                contenedor.setAttribute('aria-busy', 'true');
                
                mostrarSkeleton();
                
                if (window.innerWidth < 768) {
                    const menu = document.getElementById('menu-categorias');
                    const icon = document.getElementById('icon-toggle');
                    const btn = document.getElementById('btn-toggle-menu');
                    
                    menu.classList.add('hidden');
                    icon.classList.remove('rotate-180');
                    btn.setAttribute('aria-expanded', 'false');
                }

                fetch(url, {
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la respuesta del servidor');
                    }
                    return response.text();
                })
                .then(html => {
                    setTimeout(() => {
                        contenedor.innerHTML = html;
                        contenedor.style.opacity = '1';
                        contenedor.setAttribute('aria-busy', 'false');
                        
                        if (window.innerWidth < 768) {
                            contenedor.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }, 300);
                    
                    window.history.pushState({}, '', url);
                    
                    actualizarBotonesActivos(element);
                })
                .catch(err => {
                    console.error("Error en el filtrado:", err);
                    mostrarError();
                    contenedor.setAttribute('aria-busy', 'false');
                });
            }

            function mostrarSkeleton() {
                const contenedor = document.getElementById('contenedor-productos');
                const template = document.getElementById('skeleton-template');
                
                contenedor.style.opacity = '0';
                
                setTimeout(() => {
                    contenedor.innerHTML = template.innerHTML;
                    contenedor.style.opacity = '1';
                }, 200);
            }

            function mostrarError() {
                const contenedor = document.getElementById('contenedor-productos');
                const template = document.getElementById('error-template');
                
                contenedor.innerHTML = template.innerHTML;
                contenedor.style.opacity = '1';
            }

            function actualizarBotonesActivos(elementoActivo) {
                const botones = document.querySelectorAll('#filtro-nav a');
                
                botones.forEach(a => {
                    a.className = 'text-slate-600 hover:bg-gray-50 px-5 py-3 rounded-2xl transition-all hover:translate-x-1';
                    a.setAttribute('aria-current', 'false');
                });
                
                elementoActivo.className = 'bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all';
                elementoActivo.setAttribute('aria-current', 'page');
            }

            function verDetalles(button) {
                // Aquí puedes implementar la lógica para ver detalles
                // Por ejemplo, redirigir a una página de detalles o abrir un modal
                const card = button.closest('.producto-card');
                const titulo = card.querySelector('h3').textContent;
                
                console.log('Ver detalles de:', titulo);
                // Ejemplo: window.location.href = '/producto/detalle?id=' + productoId; EN UN FUTURO SERVIRA, ESTOY SEGURO
            }

            window.addEventListener('popstate', function(event) {
                location.reload();
            });

            // Cerrar menú al hacer clic fuera (solo móvil) aunque no se quien lo abrira en movil
            document.addEventListener('click', function(event) {
                if (window.innerWidth < 768) {
                    const menu = document.getElementById('menu-categorias');
                    const btn = document.getElementById('btn-toggle-menu');
                    
                    if (!menu.contains(event.target) && !btn.contains(event.target) && !menu.classList.contains('hidden')) {
                        toggleMenu();
                    }
                }
            });

            // Prevenir scroll cuando el menú está abierto en móvil, como dije, quien lo abrira en movil
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.attributeName === 'class') {
                        const menu = document.getElementById('menu-categorias');
                        if (window.innerWidth < 768) {
                            if (!menu.classList.contains('hidden')) {
                                document.body.style.overflow = 'hidden';
                            } else {
                                document.body.style.overflow = '';
                            }
                        }
                    }
                });
            });

            const menuElement = document.getElementById('menu-categorias');
            if (menuElement) {
                observer.observe(menuElement, { attributes: true });
            }

            // Limpiar overflow al cambiar tamaño de ventana
            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    document.body.style.overflow = '';
                }
            });
        </script>
    </div>
</body>
</html>
