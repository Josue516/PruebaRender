<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout}">
<head>
    <style>
        .producto-card { transform: translateZ(0); backface-visibility: hidden; }
        .producto-card:hover { will-change: transform, box-shadow; }
        #contenedor-productos { transition: opacity 0.3s ease; }
        html { scroll-behavior: smooth; }
        @keyframes shimmer { to { background-position: 1000px 0; } }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 1000px 100%; animation: shimmer 2s infinite; }
        .fade-in { opacity: 0; transform: translateY(20px); animation: aparecer 1s ease forwards; }
        @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div th:fragment="content">
    <div class="bg-gray-50 min-h-screen">
        <header class="bg-white border-b border-gray-100 pt-2 pb-2">
            <div class="container mx-auto px-4">
                <h1 class="text-3xl md:text-4xl lg:text-5xl font-black text-slate-900" data-aos="fade-down" data-aos-duration="1000">
                    Nuestra <span class="text-blue-600">Tienda Smart</span>
                </h1>
                <p class="text-slate-500 mt-4 text-base md:text-lg" data-aos="fade-up" data-aos-delay="200" data-aos-duration="1000">
                    Equipa tu hogar con lo último en tecnología y automatización.
                </p>
            </div>
        </header>

        <div class="container mx-auto px-4 pt-6" data-aos="fade-up" data-aos-duration="1000">
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Buscar producto</label>
                    <input type="text" id="search-input" oninput="filtrarProductos()" placeholder="Ej: Foco Inteligente..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="w-full md:w-48">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Precio máx: <span id="price-val">S/ 2000</span></label>
                    <input type="range" id="price-range" oninput="actualizarPrecioLabel(this.value); filtrarProductos()" min="0" max="2000" step="10" value="5000" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <div class="container mx-auto px-4 py-4 md:py-6">
            <div class="flex flex-col md:flex-row gap-6 lg:gap-10">
                <aside class="w-full md:w-72 lg:w-80" data-aos="fade-left" data-aos-duration="1000">
                    <button class="md:hidden w-full bg-blue-600 text-white px-5 py-3 rounded-2xl mb-4 font-bold flex items-center justify-between shadow-lg hover:bg-blue-700 transition-colors" onclick="toggleMenu()" aria-expanded="false" aria-controls="menu-categorias" id="btn-toggle-menu">
                        <span>Filtrar por Categoría</span>
                        <svg class="w-5 h-5 transition-transform duration-300" id="icon-toggle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <div id="menu-categorias" class="hidden md:block bg-white p-6 rounded-3xl shadow-sm border border-gray-100 md:sticky md:top-28">
                        <h2 class="text-xs font-black uppercase tracking-widest text-gray-400 mb-6">Categorías</h2>
                        <nav class="flex flex-col gap-2" id="filtro-nav" role="navigation" aria-label="Categorías de productos">
                            <a th:href="@{/productos}" onclick="filtrarAjax(event, this)" th:data-id="todos" th:aria-current="${categoriaSeleccionada == 'todos'} ? 'page' : 'false'" th:class="${categoriaSeleccionada == 'todos'} ? 'bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all' : 'text-slate-600 hover:bg-gray-50 px-5 py-3 rounded-2xl transition-all hover:translate-x-1'">
                                <span class="flex items-center gap-2">Todos los equipos</span>
                            </a>
                            <a th:each="cat : ${categorias}" th:href="@{/productos(idCat=${cat.idCategoria})}" th:data-id="${cat.idCategoria}" onclick="filtrarAjax(event, this)" th:text="${cat.nombre}" th:aria-current="${categoriaSeleccionada == cat.idCategoria} ? 'page' : 'false'" th:class="${categoriaSeleccionada == cat.idCategoria} ? 'bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all' : 'text-slate-600 hover:bg-gray-50 px-5 py-3 rounded-2xl transition-all hover:translate-x-1'">
                            </a>
                        </nav>
                    </div>
                </aside>

                <main class="flex-1 min-h-[400px]" id="contenedor-productos" role="main" aria-live="polite">
                    <div id="grid-productos" th:fragment="productosGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div th:if="${#lists.isEmpty(productos)}" class="col-span-full py-16 md:py-24 text-center" data-aos="fade-up">
                            <h3 class="text-xl md:text-2xl font-bold text-slate-400 mb-2">No hay productos aquí</h3>
                            <a th:href="@{/productos}" onclick="filtrarAjax(event, this)" class="text-blue-600 font-bold hover:underline">Ver todos los productos</a>
                        </div>
                    </div>

                    <template id="producto-template">
                        <article class="producto-card group bg-white rounded-[2.5rem] border border-gray-100 p-6 hover:shadow-2xl hover:shadow-blue-100 transition-all duration-500 hover:-translate-y-2 relative flex flex-col cursor-pointer" data-aos="zoom-in">
                            <div class="absolute top-4 left-4 md:left-6 right-4 flex justify-between z-10">
                                <span class="producto-marca bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-full shadow-sm border border-gray-100"></span>
                                <button class="producto-btn-vista bg-white/80 backdrop-blur-sm hover:bg-slate-900 hover:text-white text-slate-600 w-11 h-11 rounded-2xl flex items-center justify-center transition-all duration-300 shadow-sm border border-gray-100 opacity-0 group-hover:opacity-100 transform -translate-y-2 group-hover:translate-y-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                            <div class="aspect-square rounded-2xl md:rounded-3xl bg-slate-50 mb-4 md:mb-6 overflow-hidden flex items-center justify-center p-4 md:p-6">
                                <img class="producto-img w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-700" loading="lazy" decoding="async">
                            </div>
                            <div class="space-y-2 flex-1">
                                <p class="producto-categoria text-blue-600 text-[10px] font-black uppercase tracking-widest"></p>
                                <h3 class="producto-nombre text-slate-900 font-bold text-lg md:text-xl leading-tight h-12 md:h-14 line-clamp-2 group-hover:text-blue-600 transition-colors"></h3>
                                <div class="flex items-center justify-between pt-3 md:pt-4">
                                    <span class="producto-precio text-xl md:text-2xl font-black text-slate-900"></span>
                                    <span class="text-blue-600 text-sm font-bold flex items-center gap-1 group-hover:gap-2 transition-all">
                                        Detalles
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                                    </span>
                                </div>
                            </div>
                            <button class="producto-btn-carrito w-full bg-blue-600 hover:bg-slate-900 text-white py-3.5 md:py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-lg hover:shadow-xl active:scale-95 mt-4 group/btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="group-hover/btn:scale-110 transition-transform"><path d="M16 11V7a4 4 0 00-8 0v4"/><path d="M5 9h14l1 12H4L5 9z"/></svg>
                                <span>Agregar al carrito</span>
                            </button>
                        </article>
                    </template>
                </main>
            </div>
        </div>

        <div id="cart-overlay" class="fixed inset-0 bg-black/50 z-[60] hidden backdrop-blur-sm transition-opacity duration-300 opacity-0"></div>
<aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[400px] bg-white z-[70] shadow-2xl translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    <div class="p-5 border-b flex items-center justify-between bg-slate-50/80 backdrop-blur-sm">
        <h2 class="text-xl font-black text-slate-900 flex items-center gap-3 tracking-tight">
            <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-200">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </div>
            Tu Carrito
            <span id="cart-items-count" class="bg-blue-100 text-blue-700 text-xs font-black px-2.5 py-1 rounded-full border border-blue-200">0</span>
        </h2>
        <button onclick="toggleCart()" class="p-2 hover:bg-white hover:shadow-md rounded-full transition-all text-slate-400 hover:text-slate-600 active:scale-90">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div id="cart-items-container" class="flex-1 overflow-y-auto p-5 space-y-5 bg-white">
        </div>

    <div class="border-t bg-slate-50 shadow-[0_-15px_30px_rgba(0,0,0,0.05)]">
        
        <div class="px-4 py-2 flex items-center justify-between bg-blue-50/50 border-b border-blue-100">
            <p class="text-[11px] text-slate-500">
                <span class="font-bold text-blue-600">Entrega:</span> Envío a dirección registrada.
            </p>
            <a href="/usuario/panel" target="_blank" class="text-[11px] font-bold text-blue-600 hover:underline flex items-center gap-1">
                Editar perfil
            </a>
        </div>

        <div class="p-6 space-y-4">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-tight">Total a pagar</span>
                <span id="cart-total-price" class="text-xl font-black text-slate-900 leading-none">S/ 0.00</span>
            </div>
            
            <button id="btn-pre-finalizar" onclick="verificarYMostrarPaypal()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all active:scale-95 flex items-center justify-center gap-3">
                <span>FINALIZAR COMPRA</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
            
            <div id="paypal-button-container" class="hidden"></div>

            <div class="text-center pt-2">
                <button onclick="limpiarCarrito()" class="group inline-flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-red-500 transition-all">
                    <span class="p-1.5 rounded-lg bg-slate-100 group-hover:bg-red-50 transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1-1v3M4 7h16"/></svg>
                    </span>
                    VACIAR MI CARRITO
                </button>
            </div>
        </div>
    </div>
</aside>
        <div id="modal-detalles" class="fixed inset-0 z-[80] hidden overflow-y-auto" role="dialog" aria-modal="true">
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="cerrarModal()"></div>
            <div class="flex min-h-full items-center justify-center p-4">
                <div class="relative transform overflow-hidden rounded-[2.5rem] bg-white shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-4xl flex flex-col md:flex-row">
                    <button onclick="cerrarModal()" class="absolute top-5 right-5 z-10 p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                    <div class="w-full md:w-1/2 bg-slate-50 p-8 flex items-center justify-center">
                        <img id="modal-img" src="" alt="" class="max-h-[400px] object-contain mix-blend-multiply">
                    </div>
                    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                        <span id="modal-marca" class="text-blue-600 text-xs font-black uppercase tracking-widest mb-2"></span>
                        <h3 id="modal-titulo" class="text-3xl font-black text-slate-900 mb-4 leading-tight"></h3>
                        <p id="modal-categoria" class="text-slate-500 text-sm mb-6 italic"></p>
                        <div class="mb-6 max-h-32 overflow-y-auto pr-2">
                            <p id="modal-descripcion" class="text-slate-600 text-sm leading-relaxed">Cargando descripción...</p>
                        </div>
                        <div class="text-4xl font-black text-slate-900 mb-8">
                            <span id="modal-precio">S/ 0.00</span>
                        </div>
                        <div class="space-y-4">
                            <button id="modal-btn-agregar" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-3">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                                Añadir al carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <template id="skeleton-template">
            <div class="bg-white rounded-[2.5rem] border border-gray-100 p-6">
                <div class="aspect-square rounded-3xl bg-slate-200 mb-6 skeleton"></div>
                <div class="h-3 bg-slate-200 rounded w-1/2 mb-2 skeleton"></div>
                <div class="h-5 bg-slate-200 rounded mb-2 skeleton"></div>
                <div class="h-5 bg-slate-200 rounded w-3/4 mb-4 skeleton"></div>
                <div class="h-8 bg-slate-200 rounded w-1/3 skeleton"></div>
            </div>
        </template>

        <template id="error-template">
            <div class="col-span-full py-16 md:py-24 text-center">
                <svg class="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <h3 class="text-xl md:text-2xl font-bold text-red-500 mb-2">Error al cargar productos</h3>
                <p class="text-slate-400 mb-6">Por favor, intenta de nuevo.</p>
                <button onclick="location.reload()" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg">Recargar página</button>
            </div>
        </template>
    </div>
</div>
</body>
</html>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>AOS.init({ duration: 1000, once: true });</script>
<script th:src="@{/js/productos.js}"></script>
<script src="https://www.paypal.com/sdk/js?client-id=AT5maCPGDhT7Pay6PsRtDGT-e3D5JbSIfFYGf6HerkAhl6wVH0ReW2yOANLq_mH_F1BXkW-OEtJyDlK1&currency=USD"></script>
