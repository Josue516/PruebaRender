<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout}">
<div th:fragment="content" 
     x-data="inventarioManager()" 
     class="min-h-screen bg-slate-100 p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-slate-900">Gestión de Inventario</h1>
    </div>

    <a th:href="@{/admin/panel}" class="mb-4 inline-block text-sm font-semibold text-slate-600 hover:text-slate-900">
        ← Volver al Panel
    </a>

    <!-- FILTROS -->
    <form method="get" th:action="@{/admin/stock}" class="flex gap-3 mb-6">

        <!-- Buscar por nombre -->
        <input type="text"
               name="nombre"
               placeholder="Buscar producto..."
               th:value="${nombreFiltro}"
               class="border rounded-xl px-4 py-2 w-64">

        <!-- Filtro categoría -->
        <select name="idCategoria"
                class="border rounded-xl px-4 py-2">
            <option value="">Todas las categorías</option>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.idCategoria}"
                    th:text="${cat.nombre}"
                    th:selected="${categoriaSeleccionada == cat.idCategoria}">
            </option>
        </select>

        <!-- Filtro estado stock -->
        <select name="estado"
                class="border rounded-xl px-4 py-2">
            <option value="">Todos los estados</option>
            <option value="bajo" 
                    th:selected="${estadoSeleccionado == 'bajo'}">
                Stock Bajo
            </option>
            <option value="normal" 
                    th:selected="${estadoSeleccionado == 'normal'}">
                Stock Normal
            </option>
        </select>

        <button type="submit"
                class="bg-blue-600 text-white px-5 py-2 rounded-xl hover:bg-blue-700 font-semibold">
            Filtrar
        </button>
        
        <a th:href="@{/admin/stock}"
           class="bg-gray-200 px-4 py-2 rounded-xl hover:bg-gray-300 font-semibold flex items-center">
           Limpiar
        </a>
    </form>

    <!-- TABLA -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">Producto</th>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">Categoría</th>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">Stock Actual</th>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">Stock Mínimo</th>
                    <th class="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase">Estado</th>
                    <th class="px-6 py-3 text-center text-xs font-bold text-slate-500 uppercase">Acciones</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-slate-100">
                <tr th:each="inv : ${inventarios}" class="hover:bg-slate-50">

                    <td class="px-6 py-3 text-sm text-slate-500" 
                        th:text="${inv.idInventario}"></td>

                    <td class="px-6 py-3">
                        <div class="flex flex-col">
                            <span class="font-bold text-slate-900" 
                                  th:text="${inv.producto.nombre}"></span>
                            <span class="text-xs text-slate-500" 
                                  th:text="${inv.producto.marca}"></span>
                        </div>
                    </td>

                    <td class="px-6 py-3 text-sm"
                        th:text="${inv.producto.categoria.nombre}">
                    </td>

                    <td class="px-6 py-3">
                        <span class="text-lg font-bold"
                              th:classappend="${inv.stock <= inv.stockMinimo} ? 'text-red-600' : 'text-slate-900'"
                              th:text="${inv.stock}">
                        </span>
                    </td>

                    <td class="px-6 py-3 text-sm text-slate-600"
                        th:text="${inv.stockMinimo}">
                    </td>

                    <td class="px-6 py-3">
                        <span class="px-3 py-1 rounded-full text-xs font-bold"
                              th:classappend="${inv.stock <= inv.stockMinimo} ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'"
                              th:text="${inv.stock <= inv.stockMinimo} ? '⚠️ Stock Bajo' : '✓ Normal'">
                        </span>
                    </td>

                    <td class="px-6 py-3 text-center">
                        <button
                            th:data-id="${inv.idInventario}"
                            th:data-stock="${inv.stock}"
                            th:data-stock-minimo="${inv.stockMinimo}"
                            th:data-producto="${inv.producto.nombre}"
                            @click="editarInventario(
                                parseInt($el.dataset.id),
                                parseInt($el.dataset.stock),
                                parseInt($el.dataset.stockMinimo),
                                $el.dataset.producto
                            )"
                            class="text-blue-600 font-semibold text-sm hover:text-blue-800">
                            Ajustar Stock
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL -->
    <div x-show="openModal" x-cloak class="fixed inset-0 flex items-center justify-center bg-black/40 z-50">
        <div @click.away="openModal=false"
             class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">

            <h2 class="text-2xl font-bold mb-2 text-slate-900">Ajustar Stock</h2>
            <p class="text-sm text-slate-500 mb-6" x-text="'Producto: ' + inventario.nombreProducto"></p>

            <form th:action="@{/admin/stock/actualizar/{id}(id='__ID__')}" 
                  method="post" 
                  :action="'/admin/stock/actualizar/' + inventario.idInventario">

                <!-- Mantener filtros -->
                <input type="hidden" name="nombre" th:value="${nombreFiltro}">
                <input type="hidden" name="idCategoria" th:value="${categoriaSeleccionada}">
                <input type="hidden" name="estado" th:value="${estadoSeleccionado}">

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Stock Actual
                    </label>
                    <input type="number" 
                           name="stock" 
                           x-model="inventario.stock"
                           min="0"
                           required
                           class="w-full border border-slate-300 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Stock Mínimo
                    </label>
                    <input type="number" 
                           name="stockMinimo" 
                           x-model="inventario.stockMinimo"
                           min="0"
                           required
                           class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" 
                            @click="openModal=false"
                            class="px-6 py-2.5 text-slate-600 font-semibold hover:bg-slate-200 rounded-xl transition">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition shadow-lg">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
