<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout}">
<div th:fragment="content" x-data="categoriasManager()" class="min-h-screen bg-slate-50/50 p-4 md:p-8">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <a th:href="@{/admin/panel}" 
               class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-blue-600 transition-colors mb-2 group">
                <span class="flex items-center justify-center w-7 h-7 rounded-full bg-white shadow-sm border border-slate-200 group-hover:bg-blue-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </span>
                Volver al Panel
            </a>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Gestión de Categorías</h1>
            <p class="text-slate-500 text-sm mt-1">Organiza y administra las clasificaciones de tus productos.</p>
        </div>

        <button @click="categoria = {activo:true}; isEdit=false; openModal=true"
                class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold transition-all shadow-lg shadow-blue-200 active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Nueva Categoría
        </button>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50/50">
                    <tr>
                        <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">ID</th>
                        <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">Nombre</th>
                        <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">Descripción</th>
                        <th class="px-6 py-4 text-left text-[11px] font-bold text-slate-400 uppercase tracking-widest">Estado</th>
                        <th class="px-6 py-4 text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest">Acciones</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-slate-100 bg-white">
                    <tr th:each="c : ${categorias}" class="hover:bg-slate-50/50 transition-colors group">
                        <td class="px-6 py-4 text-sm font-medium text-slate-400" th:text="${'#' + c.idCategoria}"></td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-800" th:text="${c.nombre}"></td>
                        <td class="px-6 py-4 text-sm text-slate-500 max-w-xs truncate" th:text="${c.descripcion}"></td>

                        <td class="px-6 py-4">
                            <span th:classappend="${c.activo ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-100 text-slate-500 border-slate-200'}"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border"
                                  th:text="${c.activo ? 'Activo' : 'Inactivo'}">
                            </span>
                        </td>

                        <td class="px-6 py-4 text-center">
                            <div class="flex items-center justify-center gap-3">
                                <button
                                    th:data-id="${c.idCategoria}"
                                    th:data-nombre="${c.nombre}"
                                    th:data-descripcion="${c.descripcion}"
                                    th:data-activo="${c.activo}"
                                    @click="isEdit=true; categoria={idCategoria:$el.dataset.id, nombre:$el.dataset.nombre, descripcion:$el.dataset.descripcion, activo:($el.dataset.activo==='true')}; openModal=true"
                                    class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2.25 2.25 0 113.182 3.182L11.75 21H8v-3.75l10.59-10.59z"/></svg>
                                </button>

                                <form th:action="@{/admin/categorias/toggle/{id}(id=${c.idCategoria})}" method="post" class="inline">
                                    <button type="submit"
                                            th:classappend="${c.activo ? 'text-red-500 hover:bg-red-50' : 'text-emerald-500 hover:bg-emerald-50'}"
                                            class="p-2 rounded-lg transition-colors"
                                            title="Cambiar Estado">
                                        <svg th:if="${c.activo}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                                        <svg th:if="${!c.activo}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div x-show="openModal" x-cloak 
         class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 transition-all">
        
        <div @click.away="openModal = false" 
             class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100 transform transition-all">
            
            <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-xl font-bold text-slate-900 tracking-tight" 
                    x-text="isEdit ? 'Editar Categoría' : 'Nueva Categoría'"></h2>
                <button @click="openModal = false" class="p-2 rounded-full hover:bg-slate-200/50 text-slate-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form th:action="@{/admin/categorias/save}" method="post" class="p-8 space-y-5">
                <input type="hidden" name="idCategoria" x-model="categoria.idCategoria">

                <div class="space-y-1.5">
                    <label class="inline-block text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Nombre de la Categoría</label>
                    <input type="text" name="nombre" x-model="categoria.nombre" required
                           class="w-full px-4 py-3 rounded-xl border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 text-sm transition-all placeholder:text-slate-400"
                           placeholder="Ej. Electrónica, Hogar...">
                </div>

                <div class="space-y-1.5">
                    <label class="inline-block text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Descripción (Opcional)</label>
                    <textarea name="description" x-model="categoria.descripcion" rows="3"
                              class="w-full px-4 py-3 rounded-xl border-slate-200 bg-slate-50/50 focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 text-sm transition-all placeholder:text-slate-400"
                              placeholder="Describe brevemente de qué trata esta categoría..."></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4">
                    <button type="button" @click="openModal = false"
                            class="px-5 py-2.5 text-sm font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-all">
                        Cancelar
                    </button>
                    <button type="submit" 
                            class="px-7 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">
                        Guardar Categoría
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
