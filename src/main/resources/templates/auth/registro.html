<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout}">
<div th:fragment="content" class="flex items-center justify-center py-16 px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Crear cuenta</h1>

    <div th:if="${error}" class="mb-4 p-3 rounded bg-red-100 text-red-700" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post" th:object="${form}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de usuario</label>
        <input th:field="*{nombreUsuario}" class="w-full border rounded-lg px-3 py-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
        <input th:field="*{correo}" type="email" class="w-full border rounded-lg px-3 py-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input th:field="*{contrasena}" type="password" class="w-full border rounded-lg px-3 py-2" required>
      </div>
      
      <div>
      	<label class="block text-sm font-medium text-slate-700 mb-1">Dirección</label>
      	<input th:field="*{direccion}" type="text" class="w-full border rounded-lg px-3 py-2" required>
      </div>
      
      <div>
      	<label class="block text-sm font-medium text-slate-700 mb-1">Num. Telefonico</label>
      	<input th:field="*{numero}" type="text" class="w-full border rounded-lg px-3 py-2" required>
      </div>

      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 font-semibold">
        Crear cuenta
      </button>

      <p class="text-sm text-slate-600 text-center">
        ¿Ya tienes cuenta? <a href="/login" class="text-blue-600 font-semibold">Inicia sesión</a>
      </p>
    </form>
  </div>

</div>
</html>
