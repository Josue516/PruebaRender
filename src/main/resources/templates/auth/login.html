<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout}">
<div th:fragment="content" class="flex items-center justify-center py-16 px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Iniciar sesión</h1>

    <div th:if="${param.error}" class="mb-4 p-3 rounded bg-red-100 text-red-700">
      Usuario o contraseña incorrectos.
    </div>

    <div th:if="${param.registrado}" class="mb-4 p-3 rounded bg-green-100 text-green-700">
      Cuenta creada ✅ Ahora inicia sesión.
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Usuario o correo</label>
        <input name="usuario" type="text" class="w-full border rounded-lg px-3 py-2" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input name="contrasena" type="password" class="w-full border rounded-lg px-3 py-2" required>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 font-semibold">
        Entrar
      </button>
    </form>

    <p class="mt-4 text-sm text-slate-600 text-center">
      ¿No tienes cuenta? <a href="/registro" class="text-blue-600 font-semibold">Regístrate</a>
    </p>
  </div>

</div>
</html>
