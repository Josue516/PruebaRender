<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.thymeleaf.org/extras/spring-security">
</html>>
<body>
<header th:fragment="header" class="sticky top-0 z-50 bg-slate-900 backdrop-blur-lg border-b border-slate-800 py-3">
    <div class="container mx-auto px-4 md:px-6 lg:px-8 flex items-center justify-between h-16 md:h-20">

        <!-- Logo -->
        <div class="flex items-center gap-3">

            <div class="w-10 h-10 bg-blue-600 rounded-3xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house w-7 h-7 text-white"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </div>

            <a href="/" class="text-2xl font-bold text-white">
                lEoDomoTics
            </a>
        </div>

        <!-- NavMenu Desktop -->
<nav class="hidden lg:flex items-center gap-8">

    <ul class="flex space-x-8">
        <li>
            <a href="/" class="relative group text-lg font-medium text-white hover:text-blue-400 transition-colors duration-300">
                Inicio
                <span class="absolute left-0 bottom-0 h-[2px] w-0 bg-sky-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </li>
        <li>
            <a href="/nosotros" class="relative group text-lg font-medium text-white hover:text-blue-400 transition-colors duration-300">
                Nosotros
                <span class="absolute left-0 bottom-0 h-[2px] w-0 bg-sky-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </li>
        <li>
            <a th:href="@{/productos}" class="relative group text-lg font-medium text-white hover:text-blue-400 transition-colors duration-300">
                Productos
                <span class="absolute left-0 bottom-0 h-[2px] w-0 bg-sky-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </li>
        <li>
            <a href="/contacto" class="relative group text-lg font-medium text-white hover:text-blue-400 transition-colors duration-300">
                Contacto
                <span class="absolute left-0 bottom-0 h-[2px] w-0 bg-sky-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </li>
    </ul>

    <!-- Botón derecho: Iniciar sesión / Salir -->
<div class="flex items-center gap-3">

    <!-- Si NO está autenticado -->
    <a sec:authorize="!isAuthenticated()"
       href="/login"
       class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-xl transition-colors duration-300">
        Iniciar sesión
    </a>

    <!-- Si está autenticado: admin -->
    <a sec:authorize="hasRole('ADMIN')"
       href="/admin/panel"
       class="border border-slate-600 hover:border-slate-400 text-white font-semibold px-5 py-2 rounded-xl transition-colors duration-300">
        Admin
    </a>

    <!-- Si está autenticado: usuario -->
    <a sec:authorize="hasRole('USUARIO') and !hasRole('ADMIN')"
       href="/usuario/panel"
       class="border border-slate-600 hover:border-slate-400 text-white font-semibold px-5 py-2 rounded-xl transition-colors duration-300">
        Mi Panel
    </a>

    <!-- Salir -->
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2 rounded-xl transition-colors duration-300">
            Salir
        </button>
    </form>
    
    <div class="relative cursor-pointer px-4" onclick="toggleCart()">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-700">
        <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.6H6.33"/>
    </svg>
    <span id="carrito-count" class="absolute -top-1 right-2 bg-blue-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
</div>

</div>

</nav>


    </div>
</header>

</body>
</html>
